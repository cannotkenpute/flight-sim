name: Datom WebGPU Port CI

on:
  push:
    branches: [datom-webgpu-port]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser dependencies
        run: npm install

      - name: Install Clojure CLI
        shell: bash
        run: |
          curl -fsSL -o /tmp/clojure-install.sh \
            https://github.com/clojure/brew-install/releases/download/1.12.6.1673/linux-install.sh
          chmod +x /tmp/clojure-install.sh
          sudo /tmp/clojure-install.sh
          clojure -Sdescribe

      - name: Reconstruct exact full simulator entrypoint
        shell: bash
        run: |
          : > /tmp/flight-app.b64
          for f in .ci/full-app/part.*.b64; do
            tr -d '[:space:]' < "$f" >> /tmp/flight-app.b64
          done
          base64 -d /tmp/flight-app.b64 > src/cljs/flight_sim/app.cljs
          echo 'e6043c2794c74233211ab3a49f4997fe0de486983f023e32ec3ff6cd1a3642d6  src/cljs/flight_sim/app.cljs' | sha256sum -c -
          test "$(wc -c < src/cljs/flight_sim/app.cljs)" -eq 23084

      - name: Compile and run CLJS smoke tests
        run: |
          clojure -M:dev -m shadow.cljs.devtools.cli compile test
          node target/node-tests.js

      - name: Build optimized full browser bundle
        run: clojure -M:dev -m shadow.cljs.devtools.cli release app

      - name: Runtime smoke through Chrome DevTools Protocol
        shell: bash
        run: |
          python3 -m http.server 8080 --directory public >/tmp/flight-http.log 2>&1 &
          SERVER_PID=$!
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --remote-debugging-port=9222 --remote-debugging-address=127.0.0.1 \
            --enable-unsafe-webgpu --enable-unsafe-swiftshader \
            --use-angle=swiftshader --disable-gpu-sandbox \
            http://127.0.0.1:8080/ >/tmp/flight-chrome.out 2>/tmp/flight-chrome.err &
          CHROME_PID=$!
          trap 'kill $CHROME_PID $SERVER_PID 2>/dev/null || true' EXIT
          cat > /tmp/runtime-smoke.mjs <<'EOF'
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          let targets;
          for (let i = 0; i < 80; i++) {
            try {
              const r = await fetch('http://127.0.0.1:9222/json/list');
              targets = await r.json();
              if (targets.some(t => t.type === 'page')) break;
            } catch (_) {}
            await sleep(250);
          }
          const page = targets?.find(t => t.type === 'page');
          if (!page) throw new Error('No Chromium page target');
          const ws = new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            ws.onopen = resolve;
            ws.onerror = reject;
          });
          let nextId = 0;
          const pending = new Map();
          ws.onmessage = event => {
            const msg = JSON.parse(event.data);
            if (msg.id && pending.has(msg.id)) {
              const {resolve, reject} = pending.get(msg.id);
              pending.delete(msg.id);
              if (msg.error) reject(new Error(JSON.stringify(msg.error)));
              else resolve(msg.result);
            }
          };
          const send = (method, params = {}) => new Promise((resolve, reject) => {
            const id = ++nextId;
            pending.set(id, {resolve, reject});
            ws.send(JSON.stringify({id, method, params}));
          });
          const evaluate = async expression => {
            const r = await send('Runtime.evaluate', {expression, returnByValue: true, awaitPromise: true});
            if (r.exceptionDetails) throw new Error(JSON.stringify(r.exceptionDetails));
            return r.result.value;
          };
          await send('Runtime.enable');
          await send('Page.enable');
          for (let i = 0; i < 80; i++) {
            if (await evaluate("Boolean(document.querySelector('canvas[aria-label=\"Datom.World PostGraphics flight simulator\"]'))")) break;
            await sleep(250);
          }
          const mounted = await evaluate("Boolean(document.querySelector('canvas[aria-label=\"Datom.World PostGraphics flight simulator\"]'))");
          if (!mounted) throw new Error('PostGraphics canvas did not mount');
          const body = await evaluate('document.body.innerText');
          if (!body.includes('AIRFRAME')) throw new Error('HUD did not mount');
          if (body.includes('PostGraphics frame rejected')) throw new Error('PostGraphics frame rejected at runtime');
          const gpu = await evaluate('Boolean(navigator.gpu)');
          const renderer = body.includes('WEBGPU') ? 'WEBGPU' : (body.includes('SOFTWARE FALLBACK') ? 'SOFTWARE FALLBACK' : 'UNKNOWN');
          const before = await evaluate("document.getElementById('cam-label')?.textContent || ''");
          await send('Input.dispatchKeyEvent', {type:'keyDown', key:'c', code:'KeyC', text:'c', unmodifiedText:'c', windowsVirtualKeyCode:67, nativeVirtualKeyCode:67});
          await send('Input.dispatchKeyEvent', {type:'keyUp', key:'c', code:'KeyC', windowsVirtualKeyCode:67, nativeVirtualKeyCode:67});
          await sleep(750);
          const after = await evaluate("document.getElementById('cam-label')?.textContent || ''");
          if (!before || !after || before === after) throw new Error(`dao.gui.event camera input failed: ${before} -> ${after}`);
          const errorBanner = await evaluate("document.querySelector('.error-banner')?.textContent || ''");
          if (errorBanner) throw new Error(errorBanner);
          console.log(JSON.stringify({gpu, renderer, cameraBefore: before, cameraAfter: after}));
          ws.close();
          EOF
          timeout 35s node /tmp/runtime-smoke.mjs
          echo '--- chrome diagnostics ---'
          tail -100 /tmp/flight-chrome.err || true
