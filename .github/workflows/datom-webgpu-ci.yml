name: Datom WebGPU Port CI

on:
  push:
    branches: [datom-webgpu-port]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser dependencies
        run: npm install

      - name: Install Clojure CLI
        shell: bash
        run: |
          curl -fsSL -o /tmp/clojure-install.sh \
            https://github.com/clojure/brew-install/releases/download/1.12.6.1673/linux-install.sh
          chmod +x /tmp/clojure-install.sh
          sudo /tmp/clojure-install.sh
          clojure -Sdescribe

      - name: Reconstruct exact full simulator entrypoint
        shell: bash
        run: |
          : > /tmp/flight-app.b64
          for f in .ci/full-app/part.*.b64; do
            tr -d '[:space:]' < "$f" >> /tmp/flight-app.b64
          done
          base64 -d /tmp/flight-app.b64 > src/cljs/flight_sim/app.cljs
          echo 'e6043c2794c74233211ab3a49f4997fe0de486983f023e32ec3ff6cd1a3642d6  src/cljs/flight_sim/app.cljs' | sha256sum -c -
          test "$(wc -c < src/cljs/flight_sim/app.cljs)" -eq 23084

      - name: Compile and run CLJS smoke tests
        run: |
          clojure -M:dev -m shadow.cljs.devtools.cli compile test
          node target/node-tests.js

      - name: Build optimized full browser bundle
        run: clojure -M:dev -m shadow.cljs.devtools.cli release app

      - name: Runtime smoke in Chromium
        shell: bash
        run: |
          cat > public/gpu-probe.html <<'EOF'
          <!doctype html><body>PROBING<script>
          document.body.textContent = 'GPU=' + Boolean(navigator.gpu);
          </script></body>
          EOF
          python3 -m http.server 8080 --directory public >/tmp/flight-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 0.2
          done
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-webgpu --enable-features=Vulkan,UseSkiaRenderer \
            --use-angle=vulkan --virtual-time-budget=7000 --dump-dom \
            http://127.0.0.1:8080/gpu-probe.html > /tmp/gpu-probe-dom.html 2>/tmp/gpu-probe.err || true
          cat /tmp/gpu-probe-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-webgpu --enable-features=Vulkan,UseSkiaRenderer \
            --use-angle=vulkan --virtual-time-budget=9000 --dump-dom \
            http://127.0.0.1:8080/ > /tmp/flight-dom.html 2>/tmp/flight-chrome.err
          grep -q 'Datom.World PostGraphics flight simulator' /tmp/flight-dom.html
          grep -q 'AIRFRAME' /tmp/flight-dom.html
          grep -Eq 'WEBGPU|SOFTWARE FALLBACK' /tmp/flight-dom.html
          if grep -q 'PostGraphics frame rejected' /tmp/flight-dom.html; then
            cat /tmp/flight-dom.html
            exit 1
          fi
          echo '--- renderer marker ---'
          grep -Eo 'WEBGPU|SOFTWARE FALLBACK' /tmp/flight-dom.html | head -1
          echo '--- chrome diagnostics ---'
          tail -80 /tmp/flight-chrome.err || true
